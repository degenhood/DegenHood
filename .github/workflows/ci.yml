name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22.14.0"
          cache: npm
          cache-dependency-path: |
            packages/sdk/package-lock.json
            packages/cli/package-lock.json

      - name: Install dependencies
        run: |
          npm ci --prefix packages/sdk
          npm ci --prefix packages/cli

      - name: Test
        run: npm test

      - name: Audit production dependencies
        run: |
          npm audit --prefix packages/sdk --omit=dev --audit-level=high
          npm audit --prefix packages/cli --omit=dev --audit-level=high

      - name: Verify package release boundary
        run: npm run verify:packages
