name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "22.14.0"
          cache: npm
          cache-dependency-path: |
            packages/sdk/package-lock.json
            packages/cli/package-lock.json

      - name: Install dependencies
        run: |
          npm ci --prefix packages/sdk
          npm ci --prefix packages/cli

      - name: Test
        run: npm test

      - name: Audit production dependencies
        run: |
          npm audit --prefix packages/sdk --omit=dev --audit-level=high
          npm audit --prefix packages/cli --omit=dev --audit-level=high

      - name: Verify package release boundary
        run: npm run verify:packages
